name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        env:
          # Optional newsletter signup endpoint (repo Settings → Variables → Actions).
          # Unset → the signup block shows an "email us" link instead of a form.
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEWSLETTER_ENDPOINT }}
        with:
          # pnpm 11.9 requires Node >= 22.13; the action defaults to Node 20.
          node-version: 22
        # withastro/action auto-detects pnpm from pnpm-lock.yaml, runs
        # `pnpm install` + `pnpm build`, and uploads ./dist as the Pages artifact.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
